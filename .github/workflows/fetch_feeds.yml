name: Fetch vacancy feeds

on:
  schedule:
    - cron: "17 5 * * *"   # daily 05:17 UTC (07:17 Kyiv), before the Databricks job
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyyaml
      - run: python scripts/fetch_feeds.py
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds/
          git diff --cached --quiet || git commit -m "feeds: daily snapshot $(date -u +%F)"
          git push
